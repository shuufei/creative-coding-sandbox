<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Coding Sandbox</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        overflow-x: hidden;
        overflow-y: auto;
      }
      canvas {
        display: block;
      }
      /* スケッチ表示時に出す一覧への戻りリンク */
      .back-link {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 9999;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #ffffff26;
        background: #000000b3;
        color: #ededed;
        font: 12px/1 "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.06em;
        text-decoration: none;
        backdrop-filter: blur(4px);
      }
      .back-link:hover {
        border-color: #ffffff66;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
